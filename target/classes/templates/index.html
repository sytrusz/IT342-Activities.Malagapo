<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Google Contacts Manager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .hero-section {
            background-color: #f8f9fa;
            padding: 60px 0;
            text-align: center;
            border-radius: 10px;
            margin-top: 50px;
        }
        .hero-title {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #333;
        }
        .hero-text {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #666;
        }
    </style>
</head>
<body class="container">
    <div class="hero-section">
        <h1 class="hero-title">Manage Your Google Contacts</h1>
        <p class="hero-text">
            Connect to your Google account to view, add, edit, and delete your contacts.
            Keep your contact information organized with our easy-to-use interface.
        </p>
        <a href="/login" class="btn btn-primary btn-lg">
            <i class="fa fa-google"></i> Login with Google
        </a>
    </div>
</body>
</html>

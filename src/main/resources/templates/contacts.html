<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Google Contacts</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    
    <script>
        function filterContacts() {
            let input = document.getElementById("search").value.toLowerCase();
            let rows = document.querySelectorAll("tbody tr");
            rows.forEach(row => {
                let name = row.querySelector("td:nth-child(2)").textContent.toLowerCase();
                let email = row.querySelector("td:nth-child(3)").textContent.toLowerCase();
                row.style.display = (name.includes(input) || email.includes(input)) ? "" : "none";
            });
        }

        function openEditModal(resourceName, name, email, phoneNumber) {
            document.getElementById("editResourceName").value = resourceName;
            document.getElementById("editName").value = name;
            document.getElementById("editEmail").value = email;
            document.getElementById("editPhoneNumber").value = phoneNumber;

            var myModal = new bootstrap.Modal(document.getElementById('editModal'));
            myModal.show();
        }
    </script>
</head>
<body class="container mt-4">
    <h1>Your Google Contacts</h1>

    <input type="text" id="search" onkeyup="filterContacts()" class="form-control mb-3" placeholder="Search contacts...">

    <table class="table table-striped">
        <thead class="table-dark">
            <tr>
                <th>#</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone Number</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="contact, iter : ${contacts}">
                <td th:text="${iter.index + 1}"></td>
                <td th:text="${contact.name}"></td>
                <td th:text="${contact.email}"></td>
                <td th:text="${contact.phoneNumber}"></td>
                <td>
                    <!-- Edit Button to Open Modal -->
                    <button class="btn btn-warning btn-sm" 
                        th:attr="onclick=|openEditModal('${contact.resourceName}', '${contact.name}', '${contact.email}', '${contact.phoneNumber}')|">
                        Edit
                    </button>

                    <!-- Delete Form -->
                    <form th:action="@{/contacts/delete}" method="post" class="d-inline">
                        <input type="hidden" name="resourceName" th:value="${contact.resourceName}">
                        <button class="btn btn-danger btn-sm">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <a href="/logout" class="btn btn-secondary mt-3">Logout</a>

    <!-- 🔹 Bootstrap Modal for Editing -->
    <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Contact</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form th:action="@{/contacts/edit}" method="post">
                        <input type="hidden" id="editResourceName" name="resourceName">
                        <div class="mb-3">
                            <label for="editName" class="form-label">Name:</label>
                            <input type="text" id="editName" name="name" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="editEmail" class="form-label">Email:</label>
                            <input type="email" id="editEmail" name="email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="editPhoneNumber" class="form-label">Phone Number:</label>
                            <input type="text" id="editPhoneNumber" name="phoneNumber" class="form-control">
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-success">Save</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
